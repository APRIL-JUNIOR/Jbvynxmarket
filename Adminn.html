<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — VYNX STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--red:#d32f2f;--red-d:#b71c1c;--bg:#0a0a0a;--card:#141414;--card2:#1f1f1f;--txt:#fff;--muted:#a0a0a0;--border:#2a2a2a;--green:#4caf50}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:110px}
h1,h2,h3{font-family:'Orbitron',sans-serif;letter-spacing:1px}
input,textarea,select,button{font-family:'Inter',sans-serif}

/* ===== LOGIN ===== */
#login{position:fixed;inset:0;background:radial-gradient(circle,#252525,#000);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity .4s}
#login.hide{opacity:0;pointer-events:none}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px 30px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-box h1{color:var(--red);font-size:1.5rem;margin-bottom:8px}
.login-box p{color:var(--muted);font-size:.85rem;margin-bottom:25px}
.login-box input{width:100%;padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--txt);font-size:1rem;margin-bottom:15px;outline:none}
.login-box input:focus{border-color:var(--red)}
.login-box button{width:100%;padding:14px;background:linear-gradient(135deg,var(--red),var(--red-d));color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:.95rem;letter-spacing:1px}
.login-box button:hover{opacity:.9}
#loginErr{color:#f44336;font-size:.8rem;margin-top:10px;display:none}

/* ===== HEADER ===== */
.admin-header{position:sticky;top:0;background:rgba(10,10,10,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:15px 20px;display:flex;justify-content:space-between;align-items:center;z-index:100}
.admin-header h1{font-size:1.1rem}
.admin-header h1 span{color:var(--red)}
.admin-header .badge{font-size:.72rem;color:var(--muted);background:var(--card2);padding:6px 14px;border-radius:20px;font-family:'Inter',sans-serif}
.admin-header .badge.online{color:var(--green)}
.admin-header .badge.offline{color:#f44336}

/* ===== CONTAINER ===== */
.container{max-width:900px;margin:0 auto;padding:25px 20px}

/* ===== TABS ===== */
.tabs{display:flex;gap:8px;margin-bottom:25px;overflow-x:auto;padding-bottom:5px}
.tab{padding:10px 18px;background:var(--card);border:1px solid var(--border);border-radius:30px;color:var(--muted);cursor:pointer;font-size:.85rem;font-weight:600;white-space:nowrap;transition:.2s}
.tab.active{background:var(--red);border-color:var(--red);color:#fff}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ===== SECTION ===== */
.section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:20px}
.section-title{font-size:1rem;color:var(--red);margin-bottom:18px;display:flex;align-items:center;gap:8px;font-family:'Orbitron',sans-serif;letter-spacing:1px}

/* ===== FORM ===== */
.field{margin-bottom:15px}
.field label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.field input,.field textarea,.field select{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--txt);font-size:.9rem;outline:none;transition:.2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(211,47,47,.15)}
.field textarea{min-height:80px;resize:vertical}

/* ===== ITEM CARD ===== */
.item-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:20px 18px 18px;margin-bottom:15px;position:relative}
.item-card .item-num{position:absolute;top:-10px;left:15px;background:var(--red);color:#fff;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:20px;font-family:'Orbitron',sans-serif}
.item-del{position:absolute;top:12px;right:12px;background:#5a0a0a;color:#fff;border:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:.2s}
.item-del:hover{background:var(--red)}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ===== BUTTONS ===== */
.btn{padding:12px 20px;border:none;border-radius:10px;font-weight:700;font-size:.85rem;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px;letter-spacing:.5px}
.btn-add{background:var(--card2);color:var(--txt);border:1px dashed var(--border);width:100%;justify-content:center;padding:14px;margin-top:5px}
.btn-add:hover{border-color:var(--red);color:var(--red);background:rgba(211,47,47,.05)}
.btn-save{background:linear-gradient(135deg,var(--red),var(--red-d));color:#fff}
.btn-save:hover{opacity:.9;transform:translateY(-2px);box-shadow:0 8px 20px rgba(211,47,47,.3)}
.btn-load{background:var(--card2);color:var(--txt);border:1px solid var(--border)}
.btn-load:hover{border-color:var(--red)}
.btn-logout{background:transparent;color:var(--muted);border:1px solid var(--border);padding:6px 12px;font-size:.72rem;border-radius:8px;cursor:pointer}
.btn-logout:hover{color:#f44336;border-color:#f44336}

/* ===== SAVE BAR ===== */
.save-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.98);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:15px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:100}
.save-bar .status{font-size:.8rem;color:var(--muted)}
.save-bar .status.ok{color:var(--green)}
.save-bar .status.err{color:#f44336}
.save-bar .actions{display:flex;gap:8px}

/* ===== TOAST ===== */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--green);color:#fff;padding:14px 26px;border-radius:12px;font-weight:600;font-size:.9rem;transition:.3s;z-index:99999;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:#f44336}

/* ===== LOADING ===== */
#loading{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:9998;color:#fff}
#loading.show{display:flex}
.spinner{width:50px;height:50px;border:4px solid rgba(255,255,255,.1);border-top-color:var(--red);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
  .row-2{grid-template-columns:1fr}
  .admin-header h1{font-size:.9rem}
  .admin-header .badge{font-size:.6rem;padding:5px 10px}
  .section{padding:16px}
  .tab{padding:8px 14px;font-size:.78rem}
  .save-bar{padding:12px 15px}
  .save-bar .status{font-size:.7rem}
  .btn{padding:10px 15px;font-size:.78rem}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h1><i class="fa-solid fa-cube"></i> VYNX ADMIN</h1>
    <p>Masukkan password untuk mengelola website</p>
    <input type="password" id="passInput" placeholder="Password admin..." autocomplete="current-password">
    <button onclick="doLogin()"><i class="fa-solid fa-lock"></i> Masuk</button>
    <div id="loginErr">❌ Password salah!</div>
  </div>
</div>

<!-- HEADER -->
<div class="admin-header">
  <h1><i class="fa-solid fa-cube" style="color:var(--red)"></i> VYNX<span>ADMIN</span></h1>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="badge" id="connStatus">⏳ Memuat...</span>
    <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </div>
</div>

<!-- MAIN -->
<div class="container">
  <div class="tabs">
    <div class="tab active" data-tab="toko"><i class="fa-solid fa-store"></i> Info Toko</div>
    <div class="tab" data-tab="sosial"><i class="fa-solid fa-share-nodes"></i> Sosial Media</div>
    <div class="tab" data-tab="produk"><i class="fa-solid fa-box"></i> Produk</div>
  </div>

  <!-- TAB INFO TOKO -->
  <div class="tab-content active" id="tab-toko">
    <div class="section">
      <div class="section-title"><i class="fa-solid fa-store"></i> Informasi Toko</div>
      <div class="field">
        <label>Nama Toko</label>
        <input type="text" id="infoNama" placeholder="VYNX STORE">
      </div>
      <div class="field">
        <label>Deskripsi Toko</label>
        <textarea id="infoDesc" placeholder="Pusat Jual Beli Akun & Game Terpercaya..."></textarea>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Link Pembayaran (untuk semua tombol "Beli Stock")</label>
        <input type="text" id="infoLink" placeholder="https://pembayaranvynx.netlify.app">
      </div>
    </div>
  </div>

  <!-- TAB SOSIAL -->
  <div class="tab-content" id="tab-sosial">
    <div class="section">
      <div class="section-title"><i class="fa-solid fa-share-nodes"></i> Sosial Media & Kontak</div>
      <div id="sosialList"></div>
      <button class="btn btn-add" onclick="addSosial()"><i class="fa-solid fa-plus"></i> Tambah Sosial Media</button>
    </div>
  </div>

  <!-- TAB PRODUK -->
  <div class="tab-content" id="tab-produk">
    <div class="section">
      <div class="section-title"><i class="fa-solid fa-box"></i> Daftar Produk</div>
      <div id="produkList"></div>
      <button class="btn btn-add" onclick="addProduk()"><i class="fa-solid fa-plus"></i> Tambah Produk</button>
    </div>
  </div>
</div>

<!-- SAVE BAR -->
<div class="save-bar">
  <div class="status" id="statusText">💡 Siap mengedit</div>
  <div class="actions">
    <button class="btn btn-load" onclick="loadData()"><i class="fa-solid fa-rotate"></i> Reload</button>
    <button class="btn btn-save" onclick="saveData()"><i class="fa-solid fa-cloud-arrow-up"></i> Simpan & Publish</button>
  </div>
</div>

<div id="toast"></div>
<div id="loading"><div class="spinner"></div></div>

<script src="config.js"></script>
<script>
/* ==================== AUTH ==================== */
function doLogin(){
  const p = document.getElementById('passInput').value;
  if(p === VYNX.ADMIN_PASS){
    sessionStorage.setItem('vynxAuth','1');
    document.getElementById('login').classList.add('hide');
    loadData();
  } else {
    document.getElementById('loginErr').style.display = 'block';
    document.getElementById('passInput').value = '';
    setTimeout(()=>{document.getElementById('loginErr').style.display='none';},3000);
  }
}
function logout(){
  if(!confirm('Logout dari admin panel?'))return;
  sessionStorage.removeItem('vynxAuth');
  location.reload();
}
document.getElementById('passInput').addEventListener('keydown', e => {if(e.key==='Enter')doLogin();});
window.addEventListener('DOMContentLoaded', () => {
  if(sessionStorage.getItem('vynxAuth')==='1'){
    document.getElementById('login').classList.add('hide');
    loadData();
  }
});

/* ==================== TABS ==================== */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-'+tab.dataset.tab).classList.add('active');
  });
});

/* ==================== ICON OPTIONS ==================== */
const ICON_OPTIONS = [
  'fa-gamepad','fa-mobile-screen','fa-crosshairs','fa-dragon','fa-ghost','fa-robot',
  'fa-gun','fa-sword','fa-shield-halved','fa-crown','fa-fire','fa-bolt','fa-star',
  'fa-heart','fa-diamond','fa-car','fa-futbol','fa-basketball','fa-fish','fa-cat',
  'fa-dice','fa-chess-knight','fa-rocket','fa-wand-magic-sparkles'
];
const SOCIAL_ICON_OPTIONS = [
  'fa-brands fa-whatsapp','fa-brands fa-tiktok','fa-brands fa-instagram',
  'fa-brands fa-facebook','fa-brands fa-telegram','fa-brands fa-youtube',
  'fa-brands fa-discord','fa-brands fa-twitter',
  'fa-solid fa-hand-holding-dollar','fa-solid fa-shield-halved','fa-solid fa-store',
  'fa-solid fa-comments','fa-solid fa-envelope','fa-solid fa-phone'
];

/* ==================== DATA ==================== */
let dataCache = {
  infoToko: { nama:'', deskripsi:'', linkPembayaran:'' },
  sosial: [],
  produk: []
};

/* ==================== LOAD ==================== */
async function loadData(){
  showLoading(true);
  setStatus('⏳ Memuat data dari server...','');
  try{
    const res = await fetch(`https://api.jsonbin.io/v3/b/${VYNX.BIN_ID}/latest`, {
      headers: { 'X-Master-Key': VYNX.MASTER_KEY }
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const d = json.record || {};
    dataCache.infoToko = d.infoToko || { nama:'', deskripsi:'', linkPembayaran:'' };
    dataCache.sosial   = Array.isArray(d.sosial) ? d.sosial : [];
    dataCache.produk   = Array.isArray(d.produk) ? d.produk : [];
    renderAll();
    document.getElementById('connStatus').textContent = '🟢 Terhubung';
    document.getElementById('connStatus').classList.add('online');
    setStatus('✅ Data berhasil dimuat','ok');
  }catch(e){
    document.getElementById('connStatus').textContent = '🔴 Gagal';
    document.getElementById('connStatus').classList.add('offline');
    setStatus('❌ Gagal memuat: ' + e.message,'err');
    showToast('Gagal memuat data: ' + e.message, true);
  }finally{
    showLoading(false);
  }
}

/* ==================== RENDER ==================== */
function renderAll(){
  document.getElementById('infoNama').value = dataCache.infoToko.nama || '';
  document.getElementById('infoDesc').value = dataCache.infoToko.deskripsi || '';
  document.getElementById('infoLink').value = dataCache.infoToko.linkPembayaran || '';
  renderSosial();
  renderProduk();
}

function renderSosial(){
  const box = document.getElementById('sosialList');
  if(dataCache.sosial.length === 0){
    box.innerHTML = '<p style="text-align:center;color:var(--muted);padding:20px;font-size:.85rem">Belum ada sosial media. Klik tombol di bawah untuk menambah.</p>';
    return;
  }
  box.innerHTML = dataCache.sosial.map((s,i) => `
    <div class="item-card">
      <div class="item-num">#${i+1}</div>
      <button class="item-del" onclick="delSosial(${i})" title="Hapus"><i class="fa-solid fa-trash"></i></button>
      <div class="field" style="margin-top:8px">
        <label>Icon</label>
        <select onchange="dataCache.sosial[${i}].icon=this.value">
          ${SOCIAL_ICON_OPTIONS.map(ic => `<option value="${ic}" ${ic===s.icon?'selected':''}>${ic}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Label</label>
        <input type="text" value="${esc(s.label||'')}" oninput="dataCache.sosial[${i}].label=this.value" placeholder="Contoh: WhatsApp">
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Link</label>
        <input type="text" value="${esc(s.link||'')}" oninput="dataCache.sosial[${i}].link=this.value" placeholder="https://...">
      </div>
    </div>
  `).join('');
}

function renderProduk(){
  const box = document.getElementById('produkList');
  if(dataCache.produk.length === 0){
    box.innerHTML = '<p style="text-align:center;color:var(--muted);padding:20px;font-size:.85rem">Belum ada produk. Klik tombol di bawah untuk menambah.</p>';
    return;
  }
  box.innerHTML = dataCache.produk.map((p,i) => `
    <div class="item-card">
      <div class="item-num">#${i+1}</div>
      <button class="item-del" onclick="delProduk(${i})" title="Hapus"><i class="fa-solid fa-trash"></i></button>
      <div class="field" style="margin-top:8px">
        <label>Nama Produk</label>
        <input type="text" value="${esc(p.nama||'')}" oninput="dataCache.produk[${i}].nama=this.value" placeholder="Blox Fruits">
      </div>
      <div class="field">
        <label>Deskripsi</label>
        <input type="text" value="${esc(p.desc||'')}" oninput="dataCache.produk[${i}].desc=this.value" placeholder="Akun blox fruits v4 on">
      </div>
      <div class="row-2">
        <div class="field">
          <label>Harga</label>
          <input type="text" value="${esc(p.harga||'')}" oninput="dataCache.produk[${i}].harga=this.value" placeholder="Rp 80.000">
        </div>
        <div class="field">
          <label>Status</label>
          <select onchange="dataCache.produk[${i}].status=this.value">
            <option value="Ready Stock" ${p.status==='Ready Stock'?'selected':''}>✅ Ready Stock</option>
            <option value="SOLD OUT" ${p.status==='SOLD OUT'?'selected':''}>❌ SOLD OUT</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>🔗 Link Gambar Produk (opsional)</label>
        <input type="text" value="${esc(p.gambar||'')}" oninput="dataCache.produk[${i}].gambar=this.value" placeholder="https://i.imgur.com/xxxxx.jpg">
        <small style="color:var(--muted);font-size:.7rem;display:block;margin-top:5px">Kalau diisi, gambar ini yang muncul. Kalau kosong, pakai icon di bawah.</small>
      </div>
      <div class="row-2">
        <div class="field">
          <label>Icon (kalau tidak pakai gambar)</label>
          <select onchange="dataCache.produk[${i}].icon=this.value">
            ${ICON_OPTIONS.map(ic => `<option value="${ic}" ${ic===p.icon?'selected':''}>${ic}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Caption Gambar</label>
          <input type="text" value="${esc(p.caption||'')}" oninput="dataCache.produk[${i}].caption=this.value" placeholder="Blox Fruits — v4 On">
        </div>
      </div>
    </div>
  `).join('');
  }

/* ==================== ADD/DELETE ==================== */
function addSosial(){
  dataCache.sosial.push({ icon:'fa-brands fa-whatsapp', label:'', link:'' });
  renderSosial();
  setStatus('➕ Sosial baru ditambahkan','');
}
function delSosial(i){
  if(!confirm('Hapus sosial ini?'))return;
  dataCache.sosial.splice(i,1);
  renderSosial();
  setStatus('🗑️ Sosial dihapus','');
}
function addProduk(){
  dataCache.produk.push({ nama:'', desc:'', harga:'', status:'Ready Stock', icon:'fa-gamepad', caption:'' });
  renderProduk();
  setStatus('➕ Produk baru ditambahkan','');
}
function delProduk(i){
  if(!confirm('Hapus produk ini?'))return;
  dataCache.produk.splice(i,1);
  renderProduk();
  setStatus('🗑️ Produk dihapus','');
}

/* ==================== SAVE ==================== */
async function saveData(){
  dataCache.infoToko = {
    nama: document.getElementById('infoNama').value.trim(),
    deskripsi: document.getElementById('infoDesc').value.trim(),
    linkPembayaran: document.getElementById('infoLink').value.trim()
  };
  showLoading(true);
  setStatus('⏳ Menyimpan...','');
  try{
    const res = await fetch(`https://api.jsonbin.io/v3/b/${VYNX.BIN_ID}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': VYNX.MASTER_KEY
      },
      body: JSON.stringify(dataCache)
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    setStatus('✅ Tersimpan! Website sudah terupdate','ok');
    showToast('🎉 Berhasil disimpan & dipublish!');
  }catch(e){
    setStatus('❌ Gagal menyimpan: ' + e.message,'err');
    showToast('Gagal menyimpan: ' + e.message, true);
  }finally{
    showLoading(false);
  }
}

/* ==================== HELPERS ==================== */
function setStatus(msg,type){
  const el = document.getElementById('statusText');
  el.textContent = msg;
  el.className = 'status ' + (type||'');
}
function showToast(msg,isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isErr ? 'err show' : 'show';
  setTimeout(()=>t.classList.remove('show'), 2800);
}
function showLoading(show){
  document.getElementById('loading').classList.toggle('show', show);
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
